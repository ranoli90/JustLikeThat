# =============================================================================
# CD Pipeline - Sprint 38
# Continuous Deployment with zero-downtime strategies
# =============================================================================

name: CD Pipeline

on:
  workflow_run:
    workflows: [CI Pipeline]
    types: [completed]
    branches: [main]

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: 1.5.7
  ECR_REPOSITORY_BACKEND: apply-as-a-service-backend
  ECR_REPOSITORY_FRONTEND: apply-as-a-service-frontend

jobs:
  # ===========================================================================
  # Plan Terraform Changes
  # ===========================================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      plan: ${{ steps.plan.outputs.stdout }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init Terraform
        run: |
          cd terraform/environments/${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'staging' }}
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=${{ github.event.workflow_run.head_branch }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TERRAFORM_LOCK_TABLE }}"

      - name: Plan Terraform
        id: plan
        run: |
          cd terraform/environments/${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'staging' }}
          terraform plan -out=tfplan -input=false \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="environment=${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'staging' }}"
        continue-on-error: true

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-plan
          path: terraform/environments/${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'staging' }}/tfplan

      - name: Comment on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Terraform plan ready for review'
            })

  # ===========================================================================
  # Manual Approval for Production
  # ===========================================================================
  approval:
    name: Approval
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.event.workflow_run.head_branch == 'main'
    environment: Production

    steps:
      - name: Approve deployment
        run: echo "Deployment approved for production"

  # ===========================================================================
  # Apply Terraform Changes
  # ===========================================================================
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [terraform-plan] # No approval needed for non-prod
    if: ${{ github.event.workflow_run.head_branch != 'main' || needs.approval.result == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform/environments/${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'staging' }}

      - name: Apply Terraform
        run: |
          cd terraform/environments/${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'staging' }}
          terraform apply -input=false tfplan

      - name: Output environment URLs
        run: |
          echo "Deployment complete!"
          echo "Environment URL: ${{ env.ENVIRONMENT_URL }}"

  # ===========================================================================
  # Deploy to ECS/EKS with Zero-Downtime
  # ===========================================================================
  deploy-application:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [terraform-apply]
    if: ${{ always() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download task definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_BACKEND }}:${{ github.sha }}

      - name: Deploy to ECS Blue-Green
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        if: ${{ github.event.workflow_run.head_branch != 'main' }}
        with:
          task-definition: task-definition_rendered.json
          service: ${{ secrets.ECS_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy to ECS with Canary
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        if: ${{ github.event.workflow_run.head_branch == 'main' }}
        with:
          task-definition: task-definition_rendered.json
          service: ${{ secrets.ECS_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true

  # ===========================================================================
  # Run Health Checks
  # ===========================================================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy-application
    steps:
      - name: Wait for deployment
        run: sleep 60

      - name: Check health endpoint
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOYMENT_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            curl -f http://localhost:3000/health || exit 1

      - name: Verify all services
        run: |
          curl -f http://${{ env.ENVIRONMENT_URL }}/health
          curl -f http://${{ env.ENVIRONMENT_URL }}/api/health

  # ===========================================================================
  # Rollback (if needed)
  # ===========================================================================
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: health-check
    if: ${{ failure() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get previous deployment
        run: |
          aws ecs describe-services \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --services ${{ secrets.ECS_SERVICE }} \
            --query 'services[0].deployments[1].taskDefinition' \
            --output text > previous_task.txt

      - name: Rollback deployment
        run: |
          PREVIOUS_TASK=$(cat previous_task.txt)
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_SERVICE }} \
            --task-definition $PREVIOUS_TASK

      - name: Notify on rollback
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🚨 Rollback initiated for ${{ env.ENVIRONMENT_URL }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚨 *Rollback Initiated*\nEnvironment: ${{ github.event.workflow_run.head_branch }}\nURL: ${{ env.ENVIRONMENT_URL }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
