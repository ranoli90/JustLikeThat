# =============================================================================
# Release Pipeline - Sprint 38
# Semantic versioning, changelog generation, and release creation
# =============================================================================

name: Release Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump (major, minor, patch)'
        required: true
        default: 'patch'

jobs:
  # ===========================================================================
  # Version Bump
  # ===========================================================================
  version-bump:
    name: Version Bump
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      release_branch: ${{ steps.version.outputs.release_branch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/git @semantic-release/changelog

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Bump version
        id: version
        run: |
          semantic-release --dry-run false --branches main --plugins @semantic-release/commit-analyzer,@semantic-release/release-notes-generator,@semantic-release/github
          NEW_VERSION=$(cat .release-version)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "release_branch=release/$NEW_VERSION" >> $GITHUB_OUTPUT

  # ===========================================================================
  # Generate Changelog
  # ===========================================================================
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs: version-bump

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: scottbrenner/generate-changelog-action@master
        env:
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

  # ===========================================================================
  # Build Release Artifacts
  # ===========================================================================
  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: version-bump

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build backend
        run: |
          cd backend && npm ci && npm run build

      - name: Build frontend
        run: |
          cd frontend && npm ci && npm run build

      - name: Package artifacts
        run: |
          mkdir -p release
          tar -czf release/backend-${{ needs.version-bump.outputs.new_version }}.tar.gz -C backend/dist .
          tar -czf release/frontend-${{ needs.version-bump.outputs.new_version }}.tar.gz -C frontend/dist .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release

  # ===========================================================================
  # Create GitHub Release
  # ===========================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version-bump, changelog, build-artifacts]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.version-bump.outputs.new_version }}
          name: Release v${{ needs.version-bump.outputs.new_version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            release/backend-*.tar.gz
            release/frontend-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # ===========================================================================
  # Publish to Package Registry
  # ===========================================================================
  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: version-bump
    if: ${{ startsWith(needs.version-bump.outputs.new_version, '1.') || startsWith(needs.version-bump.outputs.new_version, '2.') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to NPM
        run: npm publish
        working-directory: backend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ===========================================================================
  # Notify External Systems
  # ===========================================================================
  notify:
    name: Notify External Systems
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🚀 New Release Published!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚀 *Release v${{ needs.version-bump.outputs.new_version }}*\n\n*Changes:*\n• View release: ${{ github.event.release.html_url }}\n• Download artifacts from release page"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Update documentation
        run: |
          # Update API documentation
          ./scripts/update-api-docs.sh
          
          # Update deployment documentation
          ./scripts/update-deploy-docs.sh
