# Docker Compose for Local Development
# Sprint 32: Enterprise Scalability Infrastructure

version: '3.8'

services:
  # ============ CORE SERVICES ============
  
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.gateway
    image: simpleasthat/gateway:local
    container_name: simpleasthat-gateway
    ports:
      - "3000:3000"
      - "50051:50051"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/simpleasthat
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CLUSTER=false
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - postgres
      - redis
      - consul
      - kafka
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - simpleasthat-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============ DATABASE SERVICES ============

  postgres:
    image: postgres:15.2
    container_name: simpleasthat-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=simpleasthat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - simpleasthat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:16.0
    container_name: simpleasthat-pgbouncer
    environment:
      - DATABASES=postgres=host=postgres:5432
      - AUTH_TYPE=md5
      - MAX_CLIENT_CONN=10000
      - DEFAULT_POOL_SIZE=20
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
    ports:
      - "6432:6432"
    depends_on:
      - postgres
    networks:
      - simpleasthat-network

  # ============ CACHING SERVICES ============

  redis:
    image: redis:7.0-alpine
    container_name: simpleasthat-redis
    command: redis-server --appendonly yes --maxmemory 64gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - simpleasthat-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: simpleasthat-redis-exporter
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - simpleasthat-network

  # ============ MESSAGE QUEUE SERVICES ============

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: simpleasthat-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_DELETE_TOPIC_ENABLE=true
      - KAFKA_NUM_PARTITIONS=32
      - KAFKA_LOG_RETENTION_MS=604800000
      - KAFKA_MESSAGE_MAX_BYTES=10485760
      - KAFKA_COMPRESSION_TYPE=zstd
    depends_on:
      - zookeeper
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - simpleasthat-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: simpleasthat-kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
    depends_on:
      - kafka
      - zookeeper
    networks:
      - simpleasthat-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: simpleasthat-zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    networks:
      - simpleasthat-network

  # ============ SERVICE DISCOVERY ============

  consul:
    image: consul:1.15
    container_name: simpleasthat-consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    volumes:
      - consul_data:/consul/data
    networks:
      - simpleasthat-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  consul-ui:
    image: consul:1.15
    container_name: simpleasthat-consul-ui
    ports:
      - "8501:8500"
    depends_on:
      - consul
    networks:
      - simpleasthat-network

  # ============ MONITORING ============

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: simpleasthat-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - simpleasthat-network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: simpleasthat-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - simpleasthat-network

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: simpleasthat-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - simpleasthat-network

  # ============ OBSERVABILITY ============

  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: simpleasthat-jaeger
    ports:
      - "16686:16686"
      - "6831:6831/udp"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - simpleasthat-network

  # ============ DATA WAREHOUSING ============

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: simpleasthat-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=analytics
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-a7e6c8a93a8817716735d1f5600fcc8cfcbc3457c60f3d1aa188b50bebf46cae}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/config.xml:/etc/clickhouse-server/config.xml
      - ./docker/clickhouse/users.xml:/etc/clickhouse-server/users.xml
    networks:
      - simpleasthat-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ CI/CD ============

  argocd-server:
    image: quay.io/argoproj/argocd:latest
    container_name: simpleasthat-argocd
    ports:
      - "8082:8080"
    environment:
      - ARGOCD_SERVER_INSECURE=true
    volumes:
      - argocd_data:/var/lib/argocd
    networks:
      - simpleasthat-network

# ============ VOLUMES ============

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  consul_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  argocd_data:
    driver: local
  clickhouse_data:
    driver: local

# ============ NETWORKS ============

networks:
  simpleasthat-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/16
