# =============================================================================
# Vault Secrets - Sprint 38
# External secrets with HashiCorp Vault integration
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  namespace: dev
  labels:
    app: backend
    sprint: "38"
spec:
  provider:
    vault:
      server: "http://vault.vault:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "backend"

---
# =============================================================================
# Backend Secrets
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: dev
  labels:
    app: backend
    environment: dev
    sprint: "38"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  
  target:
    name: backend-secrets
    creationPolicy: Owner
  
  data:
    # Database connection
    - secretKey: database_url
      remoteRef:
        key: apply-as-a-service/database/dev
        property: connection_string
    
    # Redis connection
    - secretKey: redis_url
      remoteRef:
        key: apply-as-a-service/cache/dev
        property: connection_string
    
    # JWT secrets
    - secretKey: jwt_secret
      remoteRef:
        key: apply-as-a-service/jwt/dev
        property: secret_key
    
    - secretKey: jwt_refresh_secret
      remoteRef:
        key: apply-as-a-service/jwt/dev
        property: refresh_secret
    
    # Encryption keys
    - secretKey: encryption_master_key
      remoteRef:
        key: apply-as-a-service/encryption/dev
        property: master_key
    
    # API keys
    - secretKey: openai_api_key
      remoteRef:
        key: apply-as-a-service/application/dev
        property: openai_api_key
    
    - secretKey: sendgrid_api_key
      remoteRef:
        key: apply-as-a-service/application/dev
        property: sendgrid_api_key

---
# =============================================================================
# Backend ConfigMap
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: dev
  labels:
    app: backend
    environment: dev
    sprint: "38"
data:
  # Application configuration
  NODE_ENV: "production"
  ENVIRONMENT: "dev"
  
  # API configuration
  API_RATE_LIMIT: "100"
  API_TIMEOUT: "30000"
  
  # Feature flags
  FEATURE_ANALYTICS: "true"
  FEATURE_NOTIFICATIONS: "true"
  FEATURE_ML_ANALYSIS: "true"
  
  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  
  # Vault configuration
  VAULT_ADDR: "http://vault.vault:8200"
  VAULT_CACERT: "/vault/secrets/ca.crt"
  
  # Database configuration
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "10"
  DB_TIMEOUT: "30000"
  
  # Redis configuration
  REDIS_POOL_SIZE: "10"
  REDIS_TIMEOUT: "5000"
  
  # CORS configuration
  CORS_ORIGIN: "https://dev.apply-as-a-service.io"
  CORS_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
  CORS_CREDENTIALS: "true"

---
# =============================================================================
# Vault Agent Injector Annotation
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: dev
  labels:
    app: backend
    environment: dev
    sprint: "38"
  annotations:
    # Vault agent configuration
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "backend"
    vault.hashicorp.com/agent-limits-cpu: "500m"
    vault.hashicorp.com/agent-limits-memory: "256Mi"
    vault.hashicorp.com/agent-request-timeout: "30"
    vault.hashicorp.com/agent-cache-enable: "true"
    vault.hashicorp.com/agent-cache-size: "100"
    
    # Secret templates
    vault.hashicorp.com/agent-inject-secret-database-url: "secret/data/apply-as-a-service/database/dev"
    vault.hashicorp.com/agent-inject-secret-redis-url: "secret/data/apply-as-a-service/cache/dev"
    vault.hashicorp.com/agent-inject-secret-jwt-secret: "secret/data/apply-as-a-service/jwt/dev"
    vault.hashicorp.com/agent-inject-secret-encryption-key: "secret/data/apply-as-a-service/encryption/dev"
    
    # File templates for secrets
    vault.hashicorp.com/agent-inject-template-database-url: |
      {{- with secret "secret/data/apply-as-a-service/database/dev" -}}
      DATABASE_URL={{ .Data.connection_string }}
      {{- end }}
    
    vault.hashicorp.com/agent-inject-template-redis-url: |
      {{- with secret "secret/data/apply-as-a-service/cache/dev" -}}
      REDIS_URL={{ .Data.connection_string }}
      {{- end }}
    
    vault.hashicorp.com/agent-inject-template-jwt-secret: |
      {{- with secret "secret/data/apply-as-a-service/jwt/dev" -}}
      JWT_SECRET={{ .Data.secret_key }}
      JWT_REFRESH_SECRET={{ .Data.refresh_secret }}
      {{- end }}
