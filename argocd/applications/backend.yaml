# =============================================================================
# Backend Application - Sprint 38
# ArgoCD Application for backend service with GitOps
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  
  labels:
    app: backend
    environment: dev
    tier: backend
    sprint: "38"
  
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.slack: argocd-notifications
    notifications.argoproj.io/subscribe.on-sync-failed.slack: argocd-notifications
    notifications.argoproj.io/subscribe.on-health-degraded.slack: argocd-notifications

spec:
  project: default
  
  source:
    repoURL: https://github.com/brooketogo98/SimpleAsThat.git
    targetRevision: main
    path: k8s/services/backend
    helm:
      valueFiles:
        - values-${{ values.environment }}.yaml
      parameters:
        - name: image.tag
          value: ${{ github.sha }}
  
  destination:
    server: https://kubernetes.default.svc
    namespace: ${{ values.environment }}
  
  # Sync policy for automated deployments
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    
    syncOptions:
      - CreateNamespace=true
      - Prune=true
      - PrunePropagationPolicy=foreground
      - ApplyOutOfSyncOnly=false
    
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  # Ignore differences for managed fields
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ''
      kind: Service
      jsonPointers:
        - /spec/clusterIP
  
  # Revision history
  revisionHistoryLimit: 10
  
  # Reference to Parameter ConfigMap
  info:
    - name: Environment
      value: ${{ values.environment }}
    - name: Region
      value: ${{ values.region }}
    - name: Replicas
      value: "2"
    - name: Health Check Endpoint
      value: "/health"
    - name: Metrics Port
      value: "3000"

---
# =============================================================================
# Backend Application - Staging
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  
  labels:
    app: backend
    environment: staging
    tier: backend
    sprint: "38"

spec:
  project: default
  
  source:
    repoURL: https://github.com/brooketogo98/SimpleAsThat.git
    targetRevision: main
    path: k8s/services/backend
    helm:
      valueFiles:
        - values-staging.yaml
      parameters:
        - name: image.tag
          value: ${{ HEAD_COMMIT_ID }}
  
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    
    syncOptions:
      - CreateNamespace=true
      - Prune=true
      - PrunePropagationPolicy=foreground
    
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

---
# =============================================================================
# Backend Application - Production
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  
  labels:
    app: backend
    environment: prod
    tier: backend
    sprint: "38"
  
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.slack: argocd-notifications
    notifications.argoproj.io/subscribe.on-sync-failed.slack: argocd-notifications
    notifications.argoproj.io/subscribe.on-health-degraded.slack: argocd-notifications

spec:
  project: default
  
  source:
    repoURL: https://github.com/brooketogo98/SimpleAsThat.git
    targetRevision: main
    path: k8s/services/backend
    helm:
      valueFiles:
        - values-prod.yaml
  
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  
  # Manual sync for production (requires approval)
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    
    syncOptions:
      - CreateNamespace=true
      - Prune=true
      - PrunePropagationPolicy=foreground
    
    retry:
      limit: 2
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  
  # Manual approval required for production
  revisionHistoryLimit: 5
  
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
